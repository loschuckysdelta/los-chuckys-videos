<div class="p-3 md:p-4">
  <div
    class="flex flex-wrap align-items-center justify-content-between gap-2 mb-3 p-3 border-1 border-round-xl surface-border surface-card">
    <h3 class="m-0">Categorías</h3>
    <div class="flex gap-2">
      <button pButton label="Ordenar" icon="pi pi-sort-alt" class="p-button-secondary" (click)="openReorder()" [disabled]="loading || list.length < 2"></button>
      <button pButton label="Nueva categoría" icon="pi pi-plus" (click)="open(null)">
      </button>
      <button pButton label="Buscar" icon="pi pi-search" [loading]="loading" (click)="read(true)">
      </button>
    </div>
  </div>
  <p-table [value]="list" [loading]="loading" dataKey="_id" [scrollable]="true">
    <ng-template pTemplate="header">
      <tr>
        <th>Orden</th>
        <th>Título</th>
        <th>Creado</th>
        <th>Actualizado</th>
        <th>Acciones</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td>{{ row.order }}</td>
        <td>{{ row.title }}</td>
        <td>{{ row.created_at | date:'dd/MM/yyyy HH:mm' }}</td>
        <td>{{ row.updated_at | date:'dd/MM/yyyy HH:mm' }}</td>
        <td><button pButton icon="pi pi-pencil" aria-label="Editar categoría" class="p-button-text"
            (click)="open(row)"></button>
          <button pButton icon="pi pi-trash" aria-label="Eliminar categoría" class="p-button-text p-button-danger"
            (click)="remove(row)"></button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5" class="text-center">No hay categorías.</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog [(visible)]="modal" [modal]="true" [header]="editing ? 'Editar categoría' : 'Nueva categoría'"
  [style]="{width:'450px'}" [closable]="!saving" [draggable]="false">
  <form [formGroup]="form" (ngSubmit)="save()" class="grid">
    <div class="col-12">
      <label for="category-title">Título <span class="text-red-500">*</span></label>
      <input id="category-title" pInputText formControlName="title" class="w-full mt-2" />
      <small *ngIf="form.controls.title.touched && form.controls.title.invalid" class="text-red-500">
        Ingresa un título.
      </small>
    </div>
    <div class="col-12">
      <button pButton type="submit" label="Guardar" icon="pi pi-save" class="w-full" [loading]="saving"
        [disabled]="saving || form.invalid">
      </button>
    </div>
  </form>
</p-dialog>

<p-dialog [(visible)]="modalReorder" header="Ordenar categorías" [modal]="true" [draggable]="false" [resizable]="false"
  [closable]="!savingOrder" [closeOnEscape]="!savingOrder" [style]="{width:'720px', maxWidth:'95vw'}" appendTo="body">
  <div class="flex align-items-center justify-content-end gap-2 mb-3">
    <button pButton type="button" icon="pi pi-chevron-up" aria-label="Subir categoría" class="p-button-rounded p-button-text p-button-secondary"
      (click)="moveOrder(-1)" [disabled]="selectedIndex <= 0 || savingOrder"></button>
    <button pButton type="button" icon="pi pi-chevron-down" aria-label="Bajar categoría" class="p-button-rounded p-button-text p-button-secondary"
      (click)="moveOrder(1)" [disabled]="selectedIndex < 0 || selectedIndex >= reorderRows.length - 1 || savingOrder"></button>
    <button pButton type="button" label="Guardar orden" icon="pi pi-save" class="p-button-success p-button-sm"
      (click)="saveOrder()" [loading]="savingOrder" [disabled]="savingOrder || !reorderRows.length"></button>
  </div>
  <div class="border-1 border-round-xl surface-border surface-card overflow-hidden">
    <p-table [value]="reorderRows" selectionMode="single" [(selection)]="selectedReorderRow" dataKey="_id"
      [scrollable]="true" scrollHeight="420px" [rowHover]="true" styleClass="p-datatable-sm">
      <ng-template pTemplate="header"><tr><th style="width:90px" class="text-center">#</th><th>Categoría</th></tr></ng-template>
      <ng-template pTemplate="body" let-row let-i="rowIndex">
        <tr [pSelectableRow]="row" [pSelectableRowDisabled]="savingOrder" class="cursor-pointer" [class.bg-gray-900]="selectedReorderRow?._id === row._id">
          <td class="text-center"><span class="inline-flex border-1 surface-border border-round-lg px-2 py-1 text-sm">{{ i + 1 }}</span></td>
          <td class="font-semibold">{{ row.title }}</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</p-dialog>
